# Hyprland configuration — ported from swaywm/sway/config

# ── Monitor configuration ───────────────────────────────────────────
# Use `hyprctl monitors all` to discover monitor names/descriptions.
# Sway used description-based names; Hyprland supports desc: prefix.

#       Home setup
#                 -------
#                 |  a  |
# --------------- |  o  |
# |             | |  c  |
# |   samsung   | |     |
# |             | |     |
# --------------- |     |
#   | laptop |    ------
#   ----------
monitor = desc:Samsung Electric Company LF24T35 HK2R301835, 1920x1080, 0x0, 1
monitor = desc:AOC 24G15N AP15423Z01096, 1920x1080, 1921x0, 1
monitor = desc:Chimei Innolux Corporation 0x14C0, 1920x1080, 0x1080, 1

# -------  France setup
# |     |---------------
# |  A  ||             |
# |  c  ||    Louis    |
# |  e  ||             |
# |  r  |---------------
# |     |
# ------
monitor = desc:Acer Technologies G277HU T1UEE0018500, 2560x1440, 1080x0, 1
monitor = desc:Acer Technologies K242HYL TBNEE0038551, 1920x1080, 0x0, 1

# Fallback for any other monitor
monitor = , preferred, auto, 1

# ── Autostart ────────────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = swww-daemon
exec-once = waypaper --restore
exec-once = nm-applet

# ── Variables ────────────────────────────────────────────────────────
$mod = SUPER
$term = ghostty
$menu = wofi --show=drun --lines=6 --prompt=""

# ── General ──────────────────────────────────────────────────────────
general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = rgb(8fd4ff)
    col.inactive_border = rgba(595959aa)
}

# ── Decoration (SwayFX parity) ───────────────────────────────────────
decoration {
    rounding = 7

    blur {
        enabled = true
        size = 2
        passes = 2
        noise = 0.02
        brightness = 1.0
        contrast = 1.0
    }

    shadow {
        enabled = true
        range = 5
        color = rgb(8fd4ff)
        offset = 0, 0
    }
}

# ── Input ────────────────────────────────────────────────────────────
input {
    follow_mouse = 1
}

# ── Key bindings: General ────────────────────────────────────────────
bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive,
bind = $mod, z, exec, woomer
bind = $mod, d, exec, $menu

# Drag/resize with mod + mouse (replaces floating_modifier)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Reload config
bind = $mod, c, exec, hyprctl reload

# Exit Hyprland (equivalent to sway exit prompt)
bind = $mod, e, exec, hyprctl dispatch exit

# Lock screen
bind = $mod,v, exec, swaylock

# Screenshot (region to clipboard)
bind = $mod, y, exec, grim -g "$(slurp)" - | wl-copy

# ── Key bindings: Navigation ────────────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Down, movewindow, d
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# ── Key bindings: Workspaces ────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ── Key bindings: Layout ────────────────────────────────────────────
# Hyprland uses dwindle by default (similar to sway's splith/splitv)
bind = $mod, B, layoutmsg, preselect l
bind = $mod, V, layoutmsg, preselect d

bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating,
bind = $mod, Space, cyclenext,
bind = $mod, Space, moveactive, 0 0
# bind = $mod, A, focusparent,

# ── Scratchpad ───────────────────────────────────────────────────────
bind = $mod SHIFT, Minus, movetoworkspace, special:scratchpad
bind = $mod, Minus, togglespecialworkspace, scratchpad

# ── Resize submap ────────────────────────────────────────────────────
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , L, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Down, resizeactive, 0 10
binde = , Up, resizeactive, 0 -10
binde = , Right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# ── Dwindle layout ───────────────────────────────────────────────────
dwindle {
    preserve_split = true
}

# ── Misc ─────────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
